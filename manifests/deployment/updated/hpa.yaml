apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: elite-app-hpa
  namespace: praveensathelli11-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: elite-app

  minReplicas: 1
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70