apiVersion: v1
kind: Template

parameters:
  - name: APP
    required: true
  - name: PROJ
    required: true
  - name: REG
    required: true
  - name: TAG
    required: true
  - name: IMG
    required: true

objects:
  - apiVersion: apps/v1
    kind: Deployment

    metadata:
      name: ${APP}
      labels:
        app: ${APP}

    spec:
      replicas: 1

      selector:
        matchLabels:
          app: ${APP}

      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 25%
          maxSurge: 25%

      template:
        metadata:
          labels:
            app: ${APP}

        spec:
          containers:
            - name: ${APP}
              image: ${REG}/${PROJ}/${IMG}:${TAG}
              imagePullPolicy: Always

              ports:
                - containerPort: 8080
                  protocol: TCP

              env:
                - name: GC_MAX_METASPACE_SIZE
                  value: "256"

                - name: JAVA_OPTIONS
                  value: "-Duser.timezone=UTC"

              resources: {}

          restartPolicy: Always
          terminationGracePeriodSeconds: 30