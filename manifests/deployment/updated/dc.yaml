apiVersion: v1
kind: Template

parameters:
  - name: APP
    required: true
  - name: IMG
    required: true
  - name: TAG
    required: true
  - name: PROJ
    required: true

objects:

  - apiVersion: apps.openshift.io/v1
    kind: DeploymentConfig
    metadata:
      name: ${APP}
      namespace: ${PROJ}
      labels:
        app: ${APP}

    spec:
      replicas: 1

      selector:
        app: ${APP}
        deploymentconfig: ${APP}

      strategy:
        type: Rolling

      template:
        metadata:
          labels:
            app: ${APP}
            deploymentconfig: ${APP}

        spec:
          containers:
            - name: ${APP}
              image: image-registry.openshift-image-registry.svc:5000/${PROJ}/${IMG}:${TAG}
              imagePullPolicy: Always

              ports:
                - containerPort: 8081

              env:
                - name: SPRING_PROFILES_ACTIVE
                  value: dev

                - name: JAVA_OPTIONS
                  value: "-Duser.timezone=UTC"

              readinessProbe:
                httpGet:
                  path: /actuator/health
                  port: 8081
                initialDelaySeconds: 30
                periodSeconds: 10

              livenessProbe:
                httpGet:
                  path: /actuator/health
                  port: 8081
                initialDelaySeconds: 60
                periodSeconds: 20

      triggers:
        - type: ConfigChange

        - type: ImageChange
          imageChangeParams:
            automatic: true
            containerNames:
              - ${APP}
            from:
              kind: ImageStreamTag
              name: ${IMG}:${TAG}