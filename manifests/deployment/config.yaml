apiVersion: v1
kind: Template
objects:
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app: ${APP}
      name: ${APP}
      namespace: ${PROJ}
    spec:
      ports:
        - name: 8081-tcp
          port: 8081
          protocol: TCP
          targetPort: 8081
      selector:
        app: ${APP}
        deploymentconfig: ${APP}
      sessionAffinity: None
      type: ClusterIP
  - apiVersion: v1
    kind: Route
    metadata:
      labels:
        app: ${APP}
      name: ${APP}
      namespace: ${PROJ}
    spec:
      port:
        targetPort: 8081-tcp
      to:
        kind: Service
        name: ${APP}
        weight: 100
      wildcardPolicy: None
parameters:
  - description: App Name
    displayName: App Name
    name: APP
    required: true
  - description: Project Name
    displayName: PROJ Name
    name: PROJ
    required: true
  - description: ENV Name
    displayName: ENV Name
    name: ENV
    required: true
