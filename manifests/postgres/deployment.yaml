apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql-13
  namespace: praveensathelli11-dev
  labels:
    app: postgresql-13
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql-13
  template:
    metadata:
      labels:
        app: postgresql-13
    spec:
      securityContext: {}

      containers:
        - name: postgresql-13
          image: registry.redhat.io/rhel8/postgresql-13
          ports:
            - containerPort: 5432

          env:
            - name: POSTGRESQL_DATABASE
              value: sonarqube
            - name: POSTGRESQL_USER
              value: sonar
            - name: POSTGRESQL_PASSWORD
              value: sonar

          resources:
            requests:
              memory: "512Mi"
            limits:
              memory: "1Gi"

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/pgsql/data

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

      restartPolicy: Always